# Local Postgres + Redis. Run: pnpm infra:up
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    # BullMQ requires noeviction (see PITFALLS.md: BullMQ needs noeviction)
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"

volumes:
  pgdata:
