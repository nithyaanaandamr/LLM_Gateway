# After a PR merges, move its tasks to Done on a rolling bot PR.
# A human reviews and merges that PR. See ADR 0010 and PITFALLS.md: board bot.
name: Board sync

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Runs share one branch, so one at a time
concurrency:
  group: board-sync
  cancel-in-progress: false

env:
  BRANCH: bot/board-sync
  TIMEZONE: Asia/Kolkata

jobs:
  sync:
    # Skip closed-unmerged PRs and the bot's own PR (no loop)
    if: github.event.pull_request.merged && !startsWith(github.event.pull_request.head.ref, 'bot/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Rebuilt from main every run, never merged (see PITFALLS.md: Board bot)
      - name: Rebuild sync branch
        id: board
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash tools/board-bot/rebuild-branch.sh

      - name: Push and open sync PR
        if: steps.board.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --force-with-lease origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Board sync: move merged tasks to Done" \
              --body "Automated by \`.github/workflows/board-sync.yml\`. One commit per merged PR.

          Review, add the \`reviewed by nrk\` label, then merge. If the bot adds commits after you label, remove and re-add the label."
          fi
